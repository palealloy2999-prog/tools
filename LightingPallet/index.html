<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171c24">
  <meta name="description" content="55種類のライティング表現を画像から選び、英語プロンプトを作成・コピーできる無料ツール。">
  <title>Lighting Prompt Palette — palealloy tools</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="page-header">
    <h1>Lighting Prompt Palette</h1>
    <select id="language" aria-label="説明言語 / Description language" disabled><option value="ja">日本語</option><option value="en">English</option></select>
  </header>
  <main class="palette" aria-label="Lighting Prompt Palette">
    <nav id="navigation" class="lp-nav" aria-label="Categories / カテゴリへ移動"></nav>
    <div id="catalog" class="lp-grid" tabindex="0" aria-label="Lighting catalog / ライティング一覧"><p>Loading / 読み込み中…</p></div>
    <div class="lp-footer"><span id="count" aria-live="polite">Selected / 選択: 0</span><button id="clear" disabled>Clear All / 全解除</button></div>
    <textarea id="prompt" aria-label="Prompt / プロンプト" readonly spellcheck="false" placeholder="カードを選ぶと、英語のプロンプトがここに表示されます。"></textarea>
    <button id="copy" class="copy-button" disabled>Copy prompt / プロンプトをコピー</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
