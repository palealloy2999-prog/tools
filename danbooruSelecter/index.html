<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141b">
  <meta name="description" content="日本語・英語でタグを探してプロンプトを組み立てるブラウザーツール。">
  <title>Danbooru Selecter — palealloy tools</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header><a href="../">← palealloy tools</a><h1>Danbooru Selecter</h1><p>タグを探す。選んで、プロンプトに。</p></header>
  <main>
    <section class="catalog" aria-label="タグを探す">
      <div class="heading"><h2>タグを探す</h2><span id="total">0 タグ</span></div>
      <label class="field">検索<input id="search" type="search" placeholder="全カテゴリから日本語・英語で検索" autocomplete="off"></label>
      <div class="filters"><label class="field">カテゴリ<select id="category"></select></label><label class="field">セクション<select id="section"></select></label></div>
      <p id="status" role="status">読み込み中…</p>
      <div id="results" class="results"></div>
      <button id="more" hidden>さらに表示</button>
    </section>
    <section class="output" aria-label="プロンプトを組み立てる">
      <div class="heading"><h2>選択中 <span id="count">0</span></h2><button id="clear" class="quiet">すべて解除</button></div>
      <div id="chosen" class="chosen"></div>
      <div class="settings"><label class="field">区切り<select id="separator"><option value="comma">カンマ</option><option value="pipe">ランダム候補 {a|b}</option><option value="semicolon">セミコロン</option></select></label><label class="check"><input id="underscores" type="checkbox" checked> _ を空白にする</label></div>
      <label class="field">出力プロンプト<textarea id="preview" rows="7" readonly></textarea></label>
      <label class="check"><input id="trailing" type="checkbox" checked> コピー時に末尾カンマを付ける</label>
      <button id="copy" class="primary">プロンプトをコピー</button>
      <details><summary>データを読み込む</summary><p>ローカルのJSONはこのブラウザー内だけで処理します。サーバーへ送信しません。再訪問時は読み込み直してください。</p><label class="file">JSONファイルを選択<input id="files" type="file" accept=".json,application/json" multiple></label><p class="help">カスタム定型文は custom、Danbooruタグは json として読み込みます。</p><label class="field">読み込み先<select id="source"><option value="custom">custom（定型文・プロンプト）</option><option value="json">json（Danbooruタグ）</option></select></label><button id="forget" class="quiet">ローカルデータを一覧から外す</button><p><a href="./README.md">公開用データの追加方法</a></p></details>
      <p class="help">選択内容・出力設定はこのブラウザーに保存されます。</p>
    </section>
  </main>
  <div id="notice" role="status" aria-live="polite"></div>
  <footer>Made by palealloy · <a href="https://github.com/palealloy2999-prog/tools/tree/main/danbooruSelecter">GitHub</a></footer>
</body>
</html>
